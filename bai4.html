<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 4 - Bảng thông tin sinh viên</title>
    <style>
        /* CSS cho phần tiêu đề màu đỏ bên trên */
        .header {
            display: flex;
            justify-content: space-between;
            color: #cc0000;
            font-weight: bold;
            font-size: 18px;
            font-family: Arial, sans-serif;
            border-bottom: 3px solid #cc0000;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }

        /* CSS làm đẹp cho bảng giống hình mẫu */
        table {
            width: 100%;
            border-collapse: collapse; /* Gộp viền đôi thành viền đơn */
            font-family: Arial, sans-serif;
        }
        
        td {
            padding: 8px; /* Khoảng cách từ chữ đến viền ô */
        }
    </style>
</head>
<body>
    <!-- Phần 1: Tiêu đề đỏ có gạch dưới -->
    <div class="header">
        <span>Trường ĐH Ngoại Ngữ - Tin Học TPHCM</span>
        <span>Môn Lập Trình Web</span>
    </div>

    <!-- Phần 2: Bảng thông tin sinh viên -->
    <table border="1">
        
        <!-- Dòng 1 -->
        <tr>
            <td colspan="5">THÔNG TIN SINH VIÊN</td>
        </tr>

        <!-- Dòng 2 -->
        <tr>
            <!-- Ô chứa hình gộp 4 dòng xuống dưới -->
            <td rowspan="4" style="text-align: center; width: 30%;">
                <!-- Mình dùng link ảnh tạm trên mạng, bạn có thể tải ảnh về máy và đổi lại thẻ src -->
                <img src="anhanhrol.jpg" alt="Avatar Sinh Viên" width="120">
            </td>
            <td>HỌ VÀ TÊN</td>
            <!-- Gộp 3 cột -->
            <td colspan="3"><b>SIUUUUUUUUUUU</b></td>
        </tr>

        <!-- Dòng 3 -->
        <tr>
            <!-- Không có cột hình ảnh ở đây nữa vì dòng trên đã gộp (rowspan) rồi -->
            <td>MÃ SỐ SINH VIÊN</td>
            <td><b>85DH110xxx</b></td>
            <td>GIỚI TÍNH</td>
            <td><b>NAM</b></td>
        </tr>

        <!-- Dòng 4 -->
        <tr>
            <td>EMAIL</td>
            <td><b>85xxx@st.huflit.edu.vn</b></td>
            <td>SỐ ĐIỆN THOẠI</td>
            <td><b>09xxxxxxx</b></td>
        </tr>

        <!-- Dòng 5 -->
        <tr>
            <td>SỞ THÍCH</td>
            <!-- Gộp 3 cột -->
            <td colspan="3"><b>VIẾT CHƯƠNG TRÌNH</b></td>
        </tr>

    </table>
</body>
</html>
